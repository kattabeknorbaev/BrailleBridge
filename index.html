    <!-- Apply the saved or system theme before first paint (no flash). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('braillebridge:theme') || 'system';
          var mq = function (q) { return window.matchMedia(q).matches; };
          var theme = pref !== 'system' ? pref
            : (mq('(prefers-contrast: more)') || mq('(forced-colors: active)')) ? 'high-contrast'
            : mq('(prefers-color-scheme: dark)') ? 'dark' : 'light';
          document.documentElement.classList.add(theme);
          if (theme === 'high-contrast') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
